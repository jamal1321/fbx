<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Jose Garcia Chronicles</title>
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: #eee;
  color: #181818;
  font-family: Georgia, serif;
  transition: background 0.25s, color 0.25s;
}
body.dark-mode {
  background: #141414;
  color: #eaeaea;
}
header {
  background: #111;
  color: white;
  padding: 22px 16px 14px;
  text-align: center;
  border-bottom: 5px solid #c00;
}
header h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); }
header span { color: #e22; }
.tagline {
  margin: 6px 0 14px;
  letter-spacing: 1.5px;
  font-size: 13px;
  color: #ccc;
}
.masthead-bar {
  max-width: 1100px;
  margin: 0 auto;
  padding-top: 10px;
  border-top: 1px solid #333;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  color: #bbb;
}
nav {
  background: #222;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}
nav a { color: white; text-decoration: none; font-weight: bold; font-size: 15px; }
nav a:hover { color: #f44; }
.nav-btn {
  background: #333;
  border: 1px solid #555;
  padding: 6px 12px;
  font-size: 13px;
}
.nav-btn:hover { background: #444; }
main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.breaking {
  background: #b00;
  color: white;
  padding: 12px 16px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.breaking button {
  background: #111;
  font-size: 13px;
  padding: 6px 12px;
}
.breaking button:hover { background: #333; }
.hero, .card {
  background: white;
  padding: 22px;
  border: 1px solid #ccc;
  transition: background 0.25s, border-color 0.25s;
}
body.dark-mode .hero,
body.dark-mode .card,
body.dark-mode .modal-box {
  background: #202020;
  border-color: #3a3a3a;
}
.byline {
  font-size: 13px;
  color: #666;
  margin: 6px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e5e5e5;
}
body.dark-mode .byline {
  color: #aaa;
  border-color: #383838;
}
.hero img {
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  display: block;
  margin: 12px 0 4px;
  background: #ddd;
}
.img-caption {
  font-size: 13px;
  font-style: italic;
  color: #555;
  margin: 0 0 14px;
}
body.dark-mode .img-caption { color: #aaa; }
.dateline {
  font-weight: bold;
  text-transform: uppercase;
  font-size: 14px;
}
h2 { color: #a00; margin-top: 0; }
body.dark-mode h2 { color: #ff5555; }
h3 { margin: 0 0 6px; }
.stat {
  font-size: clamp(24px, 4vw, 36px);
  font-weight: bold;
  margin: 10px 0;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 15px;
}
.card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card-meta {
  font-size: 12px;
  color: #777;
  margin-bottom: 8px;
}
body.dark-mode .card-meta { color: #aaa; }
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
button {
  display: inline-block;
  background: #b00;
  color: white;
  padding: 10px 16px;
  border: 0;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
}
button:hover { background: #700; }
button.secondary { background: #444; }
button.secondary:hover { background: #222; }
button.small-btn {
  padding: 6px 10px;
  font-size: 13px;
}
/* Specs Table */
.specs-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
.specs-table th, .specs-table td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid #ddd;
}
body.dark-mode .specs-table th,
body.dark-mode .specs-table td {
  border-color: #3a3a3a;
}
.specs-table th {
  width: 34%;
  color: #a00;
  background: #f9f9f9;
}
body.dark-mode .specs-table th {
  color: #ff6666;
  background: #282828;
}
/* Timeline */
.timeline {
  border-left: 3px solid #c00;
  padding-left: 18px;
  margin: 12px 0 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.timeline-item {
  position: relative;
}
.timeline-time {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  color: #b00;
  margin-bottom: 3px;
}
body.dark-mode .timeline-time { color: #ff6666; }
/* Survival Guide */
.guide-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 10px;
}
.guide-box {
  background: #f7f7f7;
  border-left: 4px solid #b00;
  padding: 14px;
}
body.dark-mode .guide-box {
  background: #292929;
}
/* Meter */
.meter {
  height: 22px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}
body.dark-mode .meter { background: #333; }
.meter div {
  width: 99.9%;
  height: 100%;
  background: #c00;
  transition: width 0.35s ease, background 0.35s ease;
}
.slider-wrap { margin: 14px 0 6px; }
.slider-wrap input[type="range"] {
  width: 100%;
  padding: 0;
  margin: 6px 0;
  cursor: pointer;
}
/* Forms & Alerts */
input[type="text"], input[type="email"], textarea, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-family: inherit;
  border: 1px solid #bbb;
  background: white;
  color: #181818;
}
body.dark-mode input[type="text"],
body.dark-mode input[type="email"],
body.dark-mode textarea,
body.dark-mode select {
  background: #2b2b2b;
  color: #f0f0f0;
  border-color: #555;
}
.alert-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.alert-row input {
  flex: 1 1 240px;
  margin: 0;
}
.status-msg {
  font-size: 14px;
  margin: 8px
